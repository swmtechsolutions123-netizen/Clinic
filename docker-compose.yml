version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinic-sqlserver
    environment:
      SA_PASSWORD: "ClinicPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - clinic-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ClinicPassword123! -Q "SELECT 1"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Clinic API
  clinic-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic-api
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ClinicDb;User Id=sa;Password=ClinicPassword123!;"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    ports:
      - "5000:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - clinic-network
    volumes:
      - ./src/Clinic.Api:/app/src/Clinic.Api

  # Blazor WebAssembly Frontend
  clinic-frontend:
    build:
      context: .
      dockerfile: Dockerfile.BlazorWasm
    container_name: clinic-frontend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    ports:
      - "5001:80"
    depends_on:
      - clinic-api
    networks:
      - clinic-network
    volumes:
      - ./src/Clinic.BlazorWasm:/app/src/Clinic.BlazorWasm

volumes:
  sqlserver_data:

networks:
  clinic-network:
    driver: bridge
